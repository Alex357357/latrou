<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRONO MASTER - Suppression de compte</title>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 215, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .app-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .app-logo i {
            font-size: 2.8rem;
            color: #FFD966;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
        }

        .app-name {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #FFD966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .app-sub {
            font-size: 0.9rem;
            color: #a0b8cc;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
            margin-top: -0.2rem;
        }

        .warning-badge {
            background: rgba(255, 70, 70, 0.15);
            border-left: 5px solid #ff4d4d;
            padding: 1rem 1.25rem;
            border-radius: 1.2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #ffb3b3;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
        }

        .warning-badge i {
            font-size: 1.8rem;
            color: #ff4d4d;
        }

        .warning-badge span {
            color: #e0e9f0;
            font-weight: 500;
        }

        .warning-badge strong {
            color: #ff8080;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.6rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            color: #cbdae6;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        label i {
            color: #FFD966;
            width: 1.2rem;
            font-size: 1rem;
        }

        input {
            width: 100%;
            background: rgba(10, 20, 30, 0.7);
            border: 1px solid #2e4b5e;
            border-radius: 1.2rem;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            color: #f0f7ff;
            outline: none;
            transition: all 0.2s;
            font-weight: 400;
        }

        input:focus {
            border-color: #FFD966;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.15);
            background: rgba(10, 20, 30, 0.9);
        }

        input::placeholder {
            color: #5b7a8f;
            font-weight: 300;
            font-size: 0.95rem;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            margin: 1.8rem 0 1.2rem;
            padding: 0.5rem 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 1.3rem;
            height: 1.3rem;
            margin-top: 0.1rem;
            accent-color: #ff4d4d;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-group label {
            font-weight: 400;
            color: #b8ccdb;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 0;
            cursor: pointer;
            gap: 0.3rem;
        }

        .checkbox-group label strong {
            color: #ff8080;
            font-weight: 600;
        }

        .btn-delete {
            width: 100%;
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            border: none;
            border-radius: 2rem;
            padding: 1.1rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px -5px rgba(183, 28, 28, 0.5);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 100, 100, 0.3);
            margin-top: 0.5rem;
        }

        .btn-delete:hover {
            background: linear-gradient(135deg, #e53935, #c62828);
            box-shadow: 0 15px 25px -5px #b71c1c;
            transform: scale(1.01);
        }

        .btn-delete:active {
            transform: scale(0.99);
            box-shadow: 0 5px 12px -3px #b71c1c;
        }

        .btn-delete i {
            font-size: 1.3rem;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #6f8fa3;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .footer-note a {
            color: #FFD966;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        .status-message {
            margin-top: 1.2rem;
            border-radius: 1rem;
            padding: 0.9rem 1.2rem;
            font-size: 0.95rem;
            display: none;
            align-items: center;
            gap: 0.8rem;
            background: rgba(0, 200, 100, 0.15);
            border: 1px solid rgba(0, 255, 120, 0.3);
            color: #b3ffcc;
        }

        .status-message i {
            font-size: 1.3rem;
        }

        .status-message.error {
            background: rgba(255, 70, 70, 0.15);
            border-color: rgba(255, 70, 70, 0.4);
            color: #ffb3b3;
        }

        .status-message.show {
            display: flex;
        }

        /* Petite touche de design */
        .glow-text {
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="app-logo">
                <i class="fas fa-futbol"></i>
                <span class="app-name">PRONO MASTER</span>
            </div>
            <div class="app-sub">Pmu & Sport</div>
        </div>

        <div class="warning-badge">
            <i class="fas fa-exclamation-triangle"></i>
            <span><strong>Zone sensible.</strong> La suppression est définitive et irréversible.</span>
        </div>

        <!-- Formulaire de suppression -->
        <form id="deleteForm" action="#" method="post">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Adresse e-mail associée</label>
                <input type="email" id="email" name="email" placeholder="exemple@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="confirmCheck" required>
                <label for="confirmCheck">
                    Je comprends que toutes mes données (pronostics, historique, profil) seront <strong>définitivement supprimées</strong> et ne pourront pas être récupérées.
                </label>
            </div>

            <button type="submit" class="btn-delete" id="deleteBtn">
                <i class="fas fa-trash-alt"></i> Supprimer mon compte
            </button>
        </form>

        <!-- Message de statut (succès/erreur) -->
        <div id="statusMessage" class="status-message">
            <i class="fas fa-check-circle"></i>
            <span id="statusText"></span>
        </div>

        <div class="footer-note">
            <span><i class="fas fa-shield-alt" style="margin-right: 6px; color: #FFD966;"></i> Conforme RGPD – Droit à l'effacement</span>
            <span>Pour toute question : <a href="mailto:privacy@pronomaster.com">privacy@pronomaster.com</a></span>
            <span style="margin-top: 5px; opacity: 0.6;">© PRONO MASTER – Pmu & Sport</span>
        </div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('deleteForm');
            const statusDiv = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmCheck = document.getElementById('confirmCheck');

            // Fonction pour afficher un message (succès ou erreur)
            function showMessage(message, isError = false) {
                statusText.textContent = message;
                statusDiv.classList.add('show');
                if (isError) {
                    statusDiv.classList.add('error');
                    // Changer l'icône en cas d'erreur
                    const icon = statusDiv.querySelector('i');
                    icon.className = 'fas fa-exclamation-circle';
                } else {
                    statusDiv.classList.remove('error');
                    const icon = statusDiv.querySelector('i');
                    icon.className = 'fas fa-check-circle';
                }
                // Faire disparaître le message après 6 secondes
                setTimeout(() => {
                    statusDiv.classList.remove('show');
                }, 6000);
            }

            // Gestion de la soumission du formulaire
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // Récupération des valeurs
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const isChecked = confirmCheck.checked;

                // Validation côté client
                if (!email) {
                    showMessage('Veuillez saisir votre adresse e-mail.', true);
                    emailInput.focus();
                    return;
                }

                if (!password) {
                    showMessage('Veuillez saisir votre mot de passe.', true);
                    passwordInput.focus();
                    return;
                }

                if (!isChecked) {
                    showMessage('Vous devez cocher la case pour confirmer la suppression.', true);
                    confirmCheck.focus();
                    return;
                }

                // Validation basique du format email
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showMessage('Veuillez saisir une adresse e-mail valide.', true);
                    emailInput.focus();
                    return;
                }

                // --- Simulation de l'appel API / suppression en base de données ---
                // Dans un vrai projet, vous enverriez une requête POST à votre backend
                // avec les identifiants et un token CSRF.
                // Exemple: fetch('/api/delete-account', { method: 'POST', body: JSON.stringify({email, password}) })

                // Ici, on simule une opération réussie après un court délai
                // (Pour l'exemple, on ne supprime rien réellement)
                
                // Désactiver le bouton pour éviter les doubles soumissions
                const deleteBtn = document.getElementById('deleteBtn');
                const originalBtnText = deleteBtn.innerHTML;
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Suppression en cours...';

                // Simulation d'un appel réseau (à remplacer par un vrai fetch)
                setTimeout(() => {
                    // Réactiver le bouton
                    deleteBtn.disabled = false;
                    deleteBtn.innerHTML = originalBtnText;

                    // --- À des fins de démonstration, on simule un succès ---
                    // Dans la réalité, il faudrait vérifier les identifiants côté serveur.
                    // Si les identifiants sont valides, on supprime les données.
                    
                    // Pour l'exemple, on considère que tout s'est bien passé.
                    // On pourrait aussi simuler une erreur si l'email contient "error" (pour tester)
                    if (email.includes('error')) {
                        showMessage('Une erreur est survenue. Veuillez vérifier vos identifiants.', true);
                    } else {
                        showMessage('✅ Votre compte et toutes les données associées ont été supprimés. Vous allez recevoir un e-mail de confirmation.', false);
                        // Réinitialiser le formulaire
                        form.reset();
                        // Ici, on pourrait rediriger l'utilisateur après quelques secondes
                        // setTimeout(() => { window.location.href = '/'; }, 4000);
                    }

                }, 1500); // Délai simulé
            });

            // Petite amélioration : focus sur le premier champ au chargement
            window.addEventListener('load', () => {
                emailInput.focus();
            });

            // Effacer le message d'erreur si l'utilisateur modifie les champs
            emailInput.addEventListener('input', () => statusDiv.classList.remove('show'));
            passwordInput.addEventListener('input', () => statusDiv.classList.remove('show'));
            confirmCheck.addEventListener('change', () => statusDiv.classList.remove('show'));
        })();
    </script>
</body>
</html>
