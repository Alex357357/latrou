<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suppression de compte — PRONO MASTER</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #E3F2FD, #BBDEFB, #FFF);
      padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 440px; background: #FFF;
      border-radius: 24px; padding: 32px 26px;
      box-shadow: 0 12px 40px rgba(21,101,192,0.18);
    }
    h1 { color: #1565C0; font-size: 22px; margin: 0 0 6px; }
    .sub { color: #757575; font-size: 13px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #1565C0; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 13px 15px; font-size: 15px;
      border: 1.5px solid #E0E0E0; border-radius: 12px; background: #FAFCFF;
      outline: none; font-family: inherit;
    }
    input:focus { border-color: #1565C0; background: #FFF; }
    input:disabled { background: #F5F5F5; }
    button {
      width: 100%; padding: 14px; margin-top: 22px;
      background: linear-gradient(135deg, #D32F2F, #B71C1C);
      color: #FFF; border: none; border-radius: 30px;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { display: none; padding: 12px 14px; border-radius: 12px; margin-top: 16px; font-size: 14px; line-height: 1.5; }
    .msg.show { display: block; }
    .msg.ok  { background: #E8F5E9; border-left: 4px solid #2E7D32; color: #1B5E20; }
    .msg.err { background: #FFEBEE; border-left: 4px solid #D32F2F; color: #B71C1C; }
    .warn {
      background: #FFF8E1; border-left: 4px solid #FFB300;
      padding: 12px 14px; border-radius: 12px; margin: 14px 0; font-size: 13px; color: #6D4C00;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🗑️ Suppression de compte</h1>
    <p class="sub">PRONO MASTER : Pmu &amp; Sport</p>

    <div class="warn">
      ⚠️ Cette action est <strong>irréversible</strong>. Votre abonnement premium
      et vos données seront perdus.
    </div>

    <form id="form">
      <label for="email">Email du compte</label>
      <input type="email" id="email" placeholder="exemple@email.com" required />

      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="Votre mot de passe" required />

      <button type="submit" id="btn">Supprimer définitivement mon compte</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, deleteUser,
      EmailAuthProvider, reauthenticateWithCredential
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ✅ TA CONFIG FIREBASE (déjà remplie)
    const firebaseConfig = {
      apiKey: "AIzaSyDgys0vtVEDRFBGWVnGj3vXYLCZlWEc7gY",
      authDomain: "pmu-pronos.firebaseapp.com",
      projectId: "pmu-pronos",
      storageBucket: "pmu-pronos.firebasestorage.app",
      messagingSenderId: "31040271281",
      appId: "1:31040271281:web:451e942d19fc9f5a1d8390"
    };

    const auth = getAuth(initializeApp(firebaseConfig));

    const form = document.getElementById("form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    function show(text, ok) {
      msg.className = "msg show " + (ok ? "ok" : "err");
      msg.innerHTML = text;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      btn.disabled = true;
      emailInput.disabled = true;
      passwordInput.disabled = true;
      btn.textContent = "Suppression...";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        // 1) Connexion
        const cred = await signInWithEmailAndPassword(auth, email, password);

        // 2) Ré-authentification (sécurité Firebase)
        await reauthenticateWithCredential(
          cred.user,
          EmailAuthProvider.credential(email, password)
        );

        // 3) Suppression définitive du compte
        await deleteUser(cred.user);

        show("✅ Compte supprimé définitivement. Merci d'avoir utilisé PRONO MASTER.", true);
        form.reset();

      } catch (err) {
        console.error(err);
        const map = {
          "auth/user-not-found": "Aucun compte trouvé avec cet email.",
          "auth/wrong-password": "Mot de passe incorrect.",
          "auth/invalid-credential": "Email ou mot de passe incorrect.",
          "auth/invalid-email": "Format d'email invalide.",
          "auth/too-many-requests": "Trop de tentatives. Réessayez plus tard.",
          "auth/network-request-failed": "Problème de réseau.",
          "auth/unauthorized-domain": "Domaine non autorisé. Contactez le support."
        };
        show("❌ " + (map[err.code] || err.message), false);

      } finally {
        btn.disabled = false;
        emailInput.disabled = false;
        passwordInput.disabled = false;
        btn.textContent = "Supprimer définitivement mon compte";
      }
    });
  </script>
</body>
</html>
